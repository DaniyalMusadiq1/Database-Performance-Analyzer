name: Verify extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbperf
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: dbperf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dbperf" --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: dbperf
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest-only-password" --health-interval 10s --health-timeout 5s --health-retries 20
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
        env:
          DBPERF_TEST_FAILURES: 1
          DBPERF_TEST_POSTGRES_URL: postgres://dbperf:test-only-password@localhost:5432/dbperf
          DBPERF_TEST_MYSQL_URL: mysql://root:test-only-password@127.0.0.1:3306/dbperf
          DBPERF_TEST_MONGODB_URL: mongodb://localhost:27017/dbperf
          DBPERF_TEST_REDIS_URL: redis://localhost:6379/0
      - run: xvfb-run -a npm run test:host
      - run: xvfb-run -a npm run test:host
        env:
          DBPERF_VSCODE_VERSION: '1.71.2'
      - run: npm run test:ui
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: database-performance-analyzer
          path: '*.vsix'
